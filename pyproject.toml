[tool.poetry]
name = "hillkeeper-bot"
version = "0.1.0"
description = ""
authors = ["CoodingPenguin <coodingpenguin@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
discord-py = "^2.6.4"
python-dotenv = "^1.1.1"
redis = {extras = ["hiredis"], version = "^6.4.0"}
aiohttp = "^3.13.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.25"


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
